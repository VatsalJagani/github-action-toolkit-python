version: 2
updates:
- package-ecosystem: "uv"
  directory: "/"
  schedule:
    interval: "daily"
  open-pull-requests-limit: 10
  groups:
    python-dependencies:
      patterns:
        - "*"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "daily"
  groups:
    github-actions:
      patterns:
        - "*"
